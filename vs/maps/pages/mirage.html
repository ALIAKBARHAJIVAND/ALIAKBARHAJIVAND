<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 World - Mirage</title>
    <link rel="icon" href="../../file_00000000335c8243a36f62e7d1c72d21.png">
    <style>
          body {
            background-color: black;
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }
        .map-detail {
            min-height: calc(100vh - 80px);
            padding: 45px 40px 80px;
            text-align: center;
            background: #0b0b0b;
        }
        .map-detail h1 {
            margin: 0;
            font-size: 58px;
            font-weight: 900;
            letter-spacing: 4px;
            color: white;
        }
        .map-subtitle {
            margin: 10px 0 35px;
            color: #888;
            font-size: 16px;
        }
        .map-hero {
            width: 100%;
            max-width: 1200px;
            height: 500px;
            margin: 0 auto;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #292929;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        }
        .map-hero img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: 0.5s;
        }
        .map-hero:hover img {
            transform: scale(1.03);
        }
        .map-details {
            max-width: 1200px;
            margin: 35px auto 0;
            padding: 30px;
            text-align: left;
            background: #151515;
            border-left: 3px solid orange;
            border-radius: 8px;
        }
        .map-details h2 {
            margin: 0 0 15px;
            font-size: 25px;
            letter-spacing: 1px;
        }
        .map-details p {
            margin: 0;
            color: #999;
            line-height: 1.8;
        }
          .site-header {
        width: 100%;
        height: 80px;
        background-color: rgba(10, 10, 10, 0.95);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        border-bottom: 1px solid #292929;
        position: relative;
        z-index: 100;
    }
    .logo {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
    }
    .logo span {
        color: orange;
    }
    .main-nav {
        display: flex;
        align-items: center;
        gap: 35px;
        margin-left: auto;
        margin-right: 35px;
    }
    .main-nav a {
        position: relative;
        color: #aaa;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1px;
        transition: 0.3s;
    }
    .main-nav a:hover {
        color: white;
    } 
    .main-nav a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -10px;
        width: 0;
        height: 2px;
        background: orange;
        transition: 0.3s;
    }
    .main-nav a:hover::after {
        width: 100%;
    }
    .play-btn {
        padding: 11px 18px;
        background: orange;
        color: #111;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.3s;
        text-decoration: none;
    }
    .play-btn:hover {
        background: white;
        transform: translateY(-2px);
    }
    * {
        box-sizing: border-box;
    }
    .back-btn {
    position: fixed;
    top: 25px;
    left: 25Px;

    padding: 10px 18px;

    color: white;
    background: #151515;
    border: 1px solid #333;
    border-radius: 8px;

    text-decoration: none;
    font-size: 13px;
    font-weight: bold;

    transition: 0.3s ease;
    z-index: 1000;
}
.back-btn:hover {
    color: orange;
    border-color: orange;
    transform: translateX(-3px);
}
       body {
        animation: pageEnter 0.7s ease-out;
    }
    @keyframes pageEnter {
        from {
            opacity: 0;
            transform: translateY(35px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    </style>
</head>
<body>
<a onclick="history.back()" class="back-btn">BACK</a>
    <main class="map-detail">
        <h1>MIRAGE</h1>
        <p class="map-subtitle">
            One of the most iconic maps in Counter-Strike.
        </p>
        <div class="map-hero">
            <img src="../images78.jpg" alt="MIRAGE">
        </div>
        <div class="map-details">
            <h2 style="color: gray;">ABOUT MIRAGE</h2>
            <p>
                Explore Mirage and learn more about this iconic Counter-Strike 2 map.
            </p>
        </div>
    </main>
</body>
</html>
