<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 WORLD - DESERT EAGLE</title>
    <link rel="icon" href="../file_00000000335c8243a36f62e7d1c72d21.png">
    <style>
              body {
            background-color: #0b0b0b;
        }
.weapon-details {
    max-width: 1100px;
    margin: auto;
    padding: 30px;
    margin-top: 220px;

    background: linear-gradient(135deg, #151515, #0d0d0d);

    border-left: 3px solid orange;
    border-radius: 12px;

    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 40px;

    box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.weapon-showcase {
    min-height: 280px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.weapon-showcase img {
    width: 90%;
    max-height: 190px;

    object-fit: contain;

    transition: .4s ease;
}

.weapon-showcase:hover img {
    transform: scale(1.12);
}

.weapon-name {
    text-align: center;
    margin-top: 15px;
}

.weapon-name span {
    color: orange;
    font-size: 18px;
    letter-spacing: 3px;
}

.weapon-name h1 {
    color: white;
    font-size: 62px;
    margin: 7px 0;
}

.weapon-data {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-content: center;
}

.data-item {
    padding: 20px;

    background: #191919;
    border: 1px solid #292929;
    border-radius: 8px;

    transition: .3s ease;
}

.data-item:hover {
    border-color: orange;
    transform: translateX(5px);
}

.data-item span {
    display: block;
    color: #777;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.data-item strong {
    color: white;
    font-size: 20px;
}
.back-btn {
    position: fixed;
    top: 25px;
    left: 25Px;

    padding: 10px 18px;

    color: white;
    background: #151515;
    border: 1px solid #333;
    border-radius: 8px;

    text-decoration: none;
    font-size: 13px;
    font-weight: bold;

    transition: 0.3s ease;
    z-index: 1000;
}
.back-btn:hover {
    color: orange;
    border-color: orange;
    transform: translateX(-3px);
}
    body {
        animation: pageEnter 0.7s ease-out;
    }
    @keyframes pageEnter {
        from {
            opacity: 0;
            transform: translateY(35px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    </style>
</head>
<body>
<a onclick="history.back()" class="back-btn">BACK</a>
    <section class="weapon-details">

        <div class="weapon-showcase">

            <div class="weapon-name">
                <span>PISTOL</span>
                <h1>DESERT EAGLE</h1>
            </div>
        </div>
        <div class="weapon-data">

            <div class="data-item">
                <span>PRICE</span>
                <strong>$700</strong>
            </div>
            <div class="data-item">
                <span>DAMAGE</span>
                <strong>53</strong>
            </div>
            <div class="data-item">
                <span>MAGAZINE</span>
                <strong>7</strong>
            </div>
            <div class="data-item">
                <span>FIRE RATE</span>
                <strong>267 RPM</strong>
            </div>
        </div>
    </section>

    
</body>
</html>
